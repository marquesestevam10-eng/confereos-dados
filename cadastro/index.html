<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cadastro de Redes — Entrar</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e2e8f0;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .bx{width:min(92vw,380px);background:#111827;border:1px solid #334155;border-radius:16px;padding:24px}
  h1{margin:0 0 2px;font-size:21px}p{margin:0 0 18px;color:#94a3b8;font-size:14px}
  label{display:block;font-size:13px;color:#cbd5e1;margin:12px 0 6px}
  select,input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:10px;border:1px solid #475569;background:#0b1220;color:#fff}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:600}
  button:disabled{opacity:.6}.er{color:#fca5a5;font-size:13px;min-height:18px;margin-top:10px}
  .rod{margin-top:16px;font-size:12px;color:#64748b;text-align:center}
</style>
<script src="logins.js"></script>
</head>
<body>
<form class="bx" id="f" autocomplete="on">
  <h1>Cadastro de Redes</h1>
  <p>Redes, melhorias e interligações · Iguá · Regional Metropolitana</p>
  <label for="pf">Perfil</label>
  <select id="pf" name="username" autocomplete="username"><option value="estevam">Estevam Marques (edita)</option><option value="coordenador">Coordenador (consulta)</option></select>
  <label for="sn">Senha</label>
  <input id="sn" name="password" type="password" autocomplete="current-password" required>
  <button id="ok" type="submit">Entrar</button>
  <div class="er" id="er"></div>
  <div class="rod">Elaborado por Estevam Marques</div>
</form>
<script>
const b64u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function abrir(pf, senha) {
  const L = LOGINS[pf]; if (!L || !senha) return null;
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64u8(L.s), iterations: L.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64u8(L.i) }, key, b64u8(L.c)));
  } catch (e) { return null; }
}
async function sw() {
  if (!("serviceWorker" in navigator)) throw new Error("Este navegador não serve. Use o Chrome ou o Safari atualizado.");
  await navigator.serviceWorker.register("sw.js");
  const reg = await navigator.serviceWorker.ready;
  return reg.active;
}
const er = document.getElementById("er");
if (/sair=1/.test(location.search)) { localStorage.removeItem("cadTok"); localStorage.removeItem("cadPerfil"); sw().then(a => a && a.postMessage({ tok: null })).catch(() => {}); }
else if (localStorage.getItem("cadTok")) entrarCom(localStorage.getItem("cadTok"), localStorage.getItem("cadPerfil"));
async function entrarCom(tok, pf) {
  try {
    const a = await sw(); a.postMessage({ tok });
    localStorage.setItem("cadTok", tok); localStorage.setItem("cadPerfil", JSON.stringify(JSON.parse(pf)));
    await new Promise(r => setTimeout(r, 300));
    location.href = "app/";
  } catch (e) { er.textContent = e.message || String(e); }
}
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault(); er.textContent = "";
  const b = document.getElementById("ok"); b.disabled = true; b.textContent = "Abrindo…";
  const pf = document.getElementById("pf").value, tok = await abrir(pf, document.getElementById("sn").value.trim());
  if (!tok) { er.textContent = "Senha errada para este perfil."; b.disabled = false; b.textContent = "Entrar"; return; }
  await entrarCom(tok, JSON.stringify(pf));
};
</script>
</body>
</html>
